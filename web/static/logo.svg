<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 88">
  <defs>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30a46c"/>
      <stop offset="1" stop-color="#615ced"/>
    </linearGradient>
  </defs>

  <!-- Mark：点阵 + 渐变方块 + 绿色方块 -->
  <g transform="translate(6,12)">
    <g fill="#615ced">
      <circle cx="10" cy="10" r="2.4"/><circle cx="17" cy="10" r="2.4"/><circle cx="24" cy="10" r="2.4"/>
      <circle cx="10" cy="17" r="2.4"/><circle cx="17" cy="17" r="2.4"/><circle cx="24" cy="17" r="2.4"/>
      <circle cx="10" cy="24" r="2.4"/><circle cx="17" cy="24" r="2.4"/><circle cx="24" cy="24" r="2.4"/>
    </g>
    <rect x="27" y="13" width="27" height="27" rx="6" fill="url(#gp)"/>
    <rect x="38" y="38" width="18" height="18" rx="5" fill="#4ade80"/>
    <rect x="29" y="45" width="11" height="11" rx="3.5" fill="#30a46c"/>
  </g>

  <!-- Wordmark：Doc 深色 + Share 渐变，风格对齐 sensenova -->
  <text x="96" y="52" font-family="Inter,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="40" font-weight="800" letter-spacing="-1">
    <tspan fill="#1e2a4a">Doc</tspan><tspan fill="url(#gt)">Share</tspan>
  </text>
  <text x="98" y="74" font-family="Inter,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="15" font-weight="500" letter-spacing="7" fill="#82828d">文档分享平台</text>
</svg>
