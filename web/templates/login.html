{{define "login.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>{{template "head" .}}<link rel="stylesheet" href="/static/site-nav.css"></head>
<body class="auth-body has-site-nav">
  {{template "siteNav" .}}
  <div class="auth-card">
    <h1 class="auth-title">{{.SiteName}}</h1>
    <div class="alert alert-error" id="loginError" {{if not .error}}hidden{{end}}>{{.error}}</div>
    <form id="loginForm" novalidate onsubmit="event.preventDefault()">
      <label>{{$.T "login.username"}}
        <input type="text" name="username" required autofocus>
      </label>
      <label>{{$.T "login.password"}}
        <input type="password" name="password" required>
      </label>
      <label>{{$.T "login.captcha"}}
        <div class="captcha-row">
          <input type="text" name="captcha" required maxlength="4" autocomplete="off" placeholder="{{$.T "login.captchaPh"}}">
          <img id="captchaImg" class="captcha-img" alt="{{$.T "login.captchaAlt"}}" title="{{$.T "login.captchaTip"}}">
        </div>
      </label>
      <input type="hidden" name="captcha_id" id="captchaId">
      <button type="submit" class="btn btn-primary btn-block">{{$.T "login.submit"}}</button>
    </form>
    <p class="auth-alt">{{$.T "login.noAccount"}}<a href="/register">{{$.T "login.registerLink"}}</a></p>
  </div>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var errBox = document.getElementById('loginError');
  UI.bindFormValidation(form);
  function showError(msg) {
    errBox.hidden = false;
    errBox.textContent = UI.t(msg || '登录失败');
  }
  async function refreshCaptcha() {
    try {
      const res = await fetch('/captcha');
      const data = await res.json();
      document.getElementById('captchaId').value = data.id;
      document.getElementById('captchaImg').src = data.b64;
    } catch (e) { /* 忽略网络抖动，点击可重试 */ }
  }
  document.getElementById('captchaImg').addEventListener('click', refreshCaptcha);
  refreshCaptcha();
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!UI.validateForm(form)) return;
    var btn = form.querySelector('[type=submit]');
    if (btn) btn.disabled = true;
    errBox.hidden = true;
    try {
      var res = await fetch('/login', {
        method: 'POST',
        headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' },
        body: new FormData(form)
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        showError((data && data.error) || '登录失败');
        refreshCaptcha();
        if (btn) btn.disabled = false;
        return;
      }
      location.href = UI.safeRedirect(data && data.redirect, '/console');
    } catch (err) {
      showError('网络错误');
      if (btn) btn.disabled = false;
    }
  });
})();
</script>
<div class="auth-foot">
  <span>© {{now.Format "2006"}} {{.SiteName}}</span>
  <span>Powered by <a href="https://github.com/3thinkthendoit/doc-share" target="_blank" rel="noopener">DocShare</a></span>
</div>
</body>
</html>
{{end}}
