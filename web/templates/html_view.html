{{define "html_view.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
{{template "head" .}}
<style>
/* HTML 整站阅读：iframe 绝对铺满视口（勿用 flex 撑开，否则内容全高 + 外层 overflow:hidden 会裁切且无法滚动）。 */
html,body.htmlview-body{height:100%;margin:0}
.htmlview-body{
  position:relative;
  height:100%;height:100dvh;
  max-width:100%;overflow:hidden;
  background:var(--bg, #0f1115);
  box-sizing:border-box;
}
.htmlview-frame{
  position:absolute;inset:0;
  width:100%;height:100%;
  border:0;display:block;background:#fff;
}
.htmlview-export{
  position:fixed;
  right:max(16px,env(safe-area-inset-right));
  bottom:max(16px,env(safe-area-inset-bottom));
  z-index:50;
}
.htmlview-export .doc-export-btn{
  text-decoration:none;font-weight:600;font-size:13px;
  padding:10px 16px;min-height:40px;line-height:1.2;
  border-radius:999px;touch-action:manipulation;
  box-shadow:0 2px 10px rgba(15,23,42,.18);
}
.htmlview-export .doc-export-btn[aria-busy="true"]{opacity:.55;pointer-events:none}
@media (max-width:700px){
  .htmlview-export{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}
  .htmlview-export .doc-export-btn{padding:9px 14px;font-size:12px;min-height:36px}
}
</style>
</head>
<body class="htmlview-body">
  <div id="docUpdateBanner" class="doc-update-banner doc-update-banner--fixed" hidden role="status">
    <span class="doc-update-banner-text">{{$.T "reader.updateHint"}}</span>
    <button type="button" id="docUpdateReload" class="btn btn-sm btn-primary">{{$.T "reader.updateReload"}}</button>
    <button type="button" id="docUpdateDismiss" class="btn-link doc-update-dismiss">{{$.T "reader.updateDismiss"}}</button>
  </div>
  {{/*
    sandbox 不含 allow-same-origin：整站脚本运行在隔离源，无法读写本站 cookie / 调用 /console API。
    允许 scripts/forms/popups/downloads 以兼容常见打包产物（vite/webpack dist 等）。
  */}}
  <iframe class="htmlview-frame" src="{{.entryURL}}"
    sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"
    referrerpolicy="no-referrer" title="{{.doc.Title}}"></iframe>
  {{if .canExport}}
  <div class="htmlview-export">
    <a class="btn btn-sm btn-primary doc-export-btn" href="{{.exportBase}}?format=pdf" download title="{{$.T "share.downloadPdf"}}">{{$.T "share.downloadPdf"}}</a>
  </div>
  {{end}}
  <script src="/static/doc_update.js"></script>
  <script>
    if (window.DocUpdate) {
      DocUpdate.start({
        metaURL: "{{if .metaURL}}{{.metaURL}}{{end}}",
        contentVersion: {{.doc.ContentVersion}}
      });
    }
    (function () {
      function t(s) { return window.UI ? UI.t(s) : s; }
      document.querySelectorAll('.doc-export-btn').forEach(function (a) {
        a.addEventListener('click', async function (e) {
          e.preventDefault();
          if (a.dataset.busy) return;
          a.dataset.busy = '1';
          a.setAttribute('aria-busy', 'true');
          try {
            var res = await fetch(a.href, { credentials: 'same-origin' });
            var ct = (res.headers.get('Content-Type') || '').toLowerCase();
            if (!res.ok || ct.indexOf('application/json') === 0) {
              var data = {};
              try { data = await res.json(); } catch (_) {}
              if (window.UI && UI.alert) UI.alert((data && data.error) || t('share.exportFail'));
              else alert((data && data.error) || t('share.exportFail'));
              return;
            }
            var blob = await res.blob();
            var dispo = res.headers.get('Content-Disposition') || '';
            var name = 'document.pdf';
            var m = /filename\*=UTF-8''([^;]+)/i.exec(dispo) || /filename="([^"]+)"/i.exec(dispo);
            if (m) {
              try { name = decodeURIComponent(m[1]); } catch (_) { name = m[1]; }
            }
            var url = URL.createObjectURL(blob);
            var link = document.createElement('a');
            link.href = url;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
          } catch (err) {
            if (window.UI && UI.alert) UI.alert(t('share.exportFail'));
            else alert(t('share.exportFail'));
          } finally {
            delete a.dataset.busy;
            a.removeAttribute('aria-busy');
          }
        });
      });
    })();
  </script>
</body>
</html>
{{end}}
