{{define "chat.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>{{template "head" .}}</head>
<body class="chat-body" data-site-logo="{{.SiteLogo}}" data-user-name="{{if .user}}{{if .user.Nickname}}{{.user.Nickname}}{{else}}{{.user.Username}}{{end}}{{end}}">
{{template "nav" .}}
<main class="chat-wrap">
  <aside class="chat-side">
    <button type="button" class="btn btn-primary chat-new" id="newSessionBtn">＋ {{$.T "chat.newSession"}}</button>
    <div class="chat-side-label">{{$.T "chat.sessionList"}}</div>
    <div class="chat-side-list" id="sessionList"><div class="muted chat-empty">{{$.T "chat.loading"}}</div></div>
  </aside>

  <section class="chat-main">
    <div class="chat-mob-bar">
      <button type="button" class="chat-mob-menu" id="sideToggle" aria-label="Sessions">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="chat-mob-title">{{$.T "chat.title"}}</span>
      <button type="button" class="chat-mob-new" id="newSessionBtnM" aria-label="{{$.T "chat.newSession"}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-hero" id="chatHero">
        <div class="chat-hero-logo" aria-hidden="true">
          <img src="{{if .SiteLogo}}{{.SiteLogo}}{{else}}/static/logo-mark.svg{{end}}" alt="">
        </div>
        <h1 class="chat-hero-title">{{$.T "chat.welcomeTitle"}}</h1>
        <p class="chat-hero-sub">{{$.T "chat.welcomeSub"}}</p>
        <div class="chat-chips">
          <button type="button" class="chat-chip">{{$.T "chat.sug1"}}</button>
          <button type="button" class="chat-chip">{{$.T "chat.sug2"}}</button>
          <button type="button" class="chat-chip">{{$.T "chat.sug3"}}</button>
        </div>
      </div>
      <div class="chat-msgs" id="chatMsgs"></div>
    </div>

    <div class="chat-composer">
      <div class="chat-input-card" id="inputCard">
        <textarea id="chatInput" rows="1" placeholder="{{$.T "chat.inputPh"}}"></textarea>
        <div class="chat-input-foot">
          <span class="chat-hint muted chat-enter-hint-hide">{{$.T "chat.enterHint"}}</span>
          <button type="button" class="chat-send" id="sendBtn" aria-label="{{$.T "chat.send"}}" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>
</main>
<div class="chat-backdrop" id="chatBackdrop" hidden></div>

<style>
/* ===== 在线体验页布局 ===== */
.chat-body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;--chat-accent:#6366f1;--chat-accent2:#8b5cf6;background:var(--bg-soft)}
.chat-body .topnav{flex:none}
.chat-wrap{flex:1;display:flex;min-height:0;width:100%;max-width:1280px;margin:0 auto;padding:16px 20px 20px;gap:16px}
/* 滚动条 */
.chat-side-list::-webkit-scrollbar,.chat-scroll::-webkit-scrollbar{width:8px}
.chat-side-list::-webkit-scrollbar-thumb,.chat-scroll::-webkit-scrollbar-thumb{background:rgba(127,127,127,.28);border-radius:8px}
.chat-side-list::-webkit-scrollbar-thumb:hover,.chat-scroll::-webkit-scrollbar-thumb:hover{background:rgba(127,127,127,.45)}
/* ===== 侧栏 ===== */
.chat-side{width:248px;flex:none;display:flex;flex-direction:column;gap:12px;min-height:0;background:var(--bg);border:1px solid var(--border);border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:14px 12px}
.chat-new{width:100%;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,var(--chat-accent),var(--chat-accent2));border:none;box-shadow:0 4px 14px rgba(99,102,241,.32);transition:transform .12s,box-shadow .15s,filter .15s}
.chat-new:hover{filter:brightness(1.06);box-shadow:0 6px 18px rgba(99,102,241,.42);transform:translateY(-1px)}
.chat-new:active{transform:none}
.chat-side-label{font-size:12px;color:var(--muted);padding:2px 6px;letter-spacing:.05em}
.chat-side-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}
.chat-empty{padding:14px 8px;font-size:13px;line-height:1.6;border:1px dashed var(--border);border-radius:12px;text-align:center}
.chat-s-item{position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;cursor:pointer;font-size:13.5px;color:var(--text);border:1px solid transparent;background:none;text-align:left;width:100%;transition:background .12s,border-color .12s}
.chat-s-item:hover{background:var(--bg-soft)}
.chat-s-item.active{background:var(--bg-soft);border-color:var(--border)}
.chat-s-item.active::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--chat-accent),var(--chat-accent2))}
.chat-s-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-s-del{flex:none;border:none;background:none;color:var(--muted);cursor:pointer;padding:3px;border-radius:7px;display:none;line-height:1;transition:color .12s,background .12s}
.chat-s-item:hover .chat-s-del{display:inline-flex}
.chat-s-del:hover{color:#e5484d;background:rgba(229,72,77,.12)}
/* ===== 主区 ===== */
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border:1px solid var(--border);border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.06);overflow:hidden}
.chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding:6px 6px 0}
/* 欢迎区 */
.chat-hero{text-align:center;padding:11vh 16px 32px;animation:chat-fade .35s ease}
.chat-hero-logo{width:64px;height:64px;margin:0 auto 18px;border-radius:19px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--chat-accent),var(--chat-accent2));box-shadow:0 10px 28px rgba(99,102,241,.38),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}
.chat-hero-logo img{width:auto;max-width:68%;max-height:68%;object-fit:contain}
.chat-hero-title{font-size:32px;font-weight:700;margin:0 0 10px;letter-spacing:.02em;background:linear-gradient(120deg,var(--text) 30%,var(--chat-accent) 75%,var(--chat-accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.chat-hero-sub{color:var(--muted);font-size:14.5px;margin:0 0 26px}
.chat-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:620px;margin:0 auto}
.chat-chip{border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:13.5px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:border-color .15s,background .15s,transform .12s,box-shadow .15s}
.chat-chip:hover{border-color:var(--chat-accent);background:rgba(99,102,241,.06);transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.14)}
/* 消息区 */
.chat-msgs{max-width:860px;margin:0 auto;padding:8px 8px 16px;display:flex;flex-direction:column;gap:22px}
.chat-m{display:flex;gap:12px;align-items:flex-start;animation:chat-rise .22s ease}
.chat-m .chat-avatar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap}
.chat-m.assistant .chat-avatar{color:#fff;background:linear-gradient(135deg,var(--chat-accent),var(--chat-accent2));box-shadow:0 3px 10px rgba(99,102,241,.3)}
.chat-m.user{flex-direction:row-reverse}
.chat-m.user .chat-avatar{background:var(--bg-soft);border:1px solid var(--border);color:var(--text)}
.chat-bubble{max-width:78%;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.7;overflow-wrap:break-word;min-width:0}
.chat-m.user .chat-bubble{background:linear-gradient(135deg,var(--chat-accent),var(--chat-accent2));color:#fff;border-bottom-right-radius:6px;box-shadow:0 4px 14px rgba(99,102,241,.26);white-space:pre-wrap}
.chat-m.user .chat-bubble a{color:#fff}
.chat-m.assistant .chat-bubble{background:var(--bg-soft);border:1px solid var(--border);border-top-left-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.chat-m.assistant .chat-bubble>*:first-child{margin-top:0}
.chat-m.assistant .chat-bubble>*:last-child{margin-bottom:0}
.chat-m.assistant .chat-bubble pre{overflow-x:auto;padding:12px;border-radius:10px;background:rgba(127,127,127,.12);font-size:13px;border:1px solid var(--border)}
.chat-m.assistant .chat-bubble code{font-size:13px}
.chat-m.assistant .chat-bubble table{display:block;border-collapse:collapse;width:100%;overflow-x:auto}
.chat-m.assistant .chat-bubble{overflow-wrap:break-word}
.chat-m.assistant .chat-bubble img{max-width:100%}
.chat-m.assistant .chat-bubble td,.chat-m.assistant .chat-bubble th{border:1px solid var(--border);padding:5px 10px}
.chat-m-error{color:#e5484d;font-size:13.5px;margin-top:6px}
.chat-resend{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--chat-accent);font-size:13px;cursor:pointer}
.chat-resend:hover{border-color:var(--chat-accent)}
.chat-tool-status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:4px 2px}
.chat-tool-dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--chat-accent),var(--chat-accent2));animation:chat-pulse 1s ease-in-out infinite}
@keyframes chat-pulse{50%{opacity:.25;transform:scale(.8)}}
/* 流式等待加载动画 */
.chat-working{display:inline-flex;align-items:center;color:var(--muted);font-size:13.5px}
.chat-working .chat-dots{display:inline-block;min-width:2.2em;text-align:left}
.chat-working .chat-dots::after{content:"";animation:chat-dots 1.2s steps(1,end) infinite}
@keyframes chat-dots{0%{content:""}17%{content:"."}33%{content:".."}50%{content:"..."}67%{content:"...."}83%{content:"....."}100%{content:""}}
/* 流式光标 */
.chat-cursor{display:inline-block;animation:chat-blink 1s steps(2) infinite;color:var(--chat-accent);font-weight:700}
@keyframes chat-blink{50%{opacity:0}}
@keyframes chat-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes chat-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* 输入区 */
.chat-composer{flex:none;max-width:860px;width:100%;margin:12px auto 0;padding:0 14px calc(14px + env(safe-area-inset-bottom))}
.chat-input-card{border:1px solid var(--border);border-radius:18px;background:var(--bg);box-shadow:0 4px 20px rgba(0,0,0,.07);padding:14px 16px 11px;transition:border-color .15s,box-shadow .2s}
.chat-input-card:focus-within{border-color:var(--chat-accent);box-shadow:0 4px 24px rgba(99,102,241,.22)}
.chat-input-card textarea{width:100%;border:none;outline:none;resize:none;background:transparent;color:var(--text);font:inherit;font-size:14.5px;line-height:1.6;max-height:180px}
.chat-input-card textarea::placeholder{color:var(--muted)}
.chat-input-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.chat-hint{font-size:12px;user-select:none}
.chat-send{width:34px;height:34px;border-radius:11px;border:none;background:linear-gradient(135deg,var(--chat-accent),var(--chat-accent2));color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(99,102,241,.32);transition:filter .15s,transform .12s,opacity .15s}
.chat-send:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.chat-send:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
/* ===== 移动端顶栏（桌面隐藏） ===== */
.chat-mob-bar{display:none}
.chat-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;opacity:0;transition:opacity .2s}
.chat-backdrop.show{opacity:1}
/* 窄屏：抽屉式侧栏 */
@media (max-width:900px){
  .chat-wrap{padding:0;gap:0}
  .chat-mob-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);flex:none}
  .chat-mob-title{flex:1;font-weight:600;font-size:15px}
  .chat-mob-menu,.chat-mob-new{border:none;background:none;color:var(--text);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
  .chat-mob-menu:active,.chat-mob-new:active{background:var(--bg-soft)}
  .chat-side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:60;border-radius:0;border:none;box-shadow:8px 0 30px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .22s ease;padding-top:16px}
  .chat-side.open{transform:none}
  .chat-hero{padding-top:7vh}
  .chat-hero-title{font-size:24px}
  .chat-hero-logo{width:54px;height:54px;border-radius:16px}
  .chat-chips{flex-direction:column;align-items:stretch}
  .chat-msgs{padding:6px 4px 12px;gap:16px}
  .chat-bubble{max-width:86%}
  .chat-m{gap:8px}
  .chat-composer{margin-top:8px;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
  .chat-input-card{border-radius:15px;padding:11px 13px 9px}
  .chat-enter-hint-hide{display:none}
  /* iOS：聚焦字号 <16px 会自动放大页面 */
  .chat-input-card textarea{font-size:16px}
  .chat-bubble{max-width:calc(100% - 44px)}
  /* 触屏无 hover：会话删除按钮常显 */
  .chat-s-item .chat-s-del{display:inline-flex}
}
/* 触屏设备（任意宽度）下删除按钮也常显 */
@media (hover:none){
  .chat-s-item .chat-s-del{display:inline-flex}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="/static/embeds.js"></script>
<script>
(function () {
  var listEl = document.getElementById('sessionList');
  var msgsEl = document.getElementById('chatMsgs');
  var scrollEl = document.getElementById('chatScroll');
  // 气泡内链接（站内 /doc/...、/s/... 与外部链接）在新标签页打开，方便边聊边看
  scrollEl.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (href && href.charAt(0) !== '#') { e.preventDefault(); window.open(a.href, '_blank'); }
  });
  var heroEl = document.getElementById('chatHero');
  var inputEl = document.getElementById('chatInput');
  var sendBtn = document.getElementById('sendBtn');
  var newBtn = document.getElementById('newSessionBtn');
  var currentId = null;
  var sending = false;

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

  function renderMd(src) {
    try {
      if (window.Embeds && Embeds.parseMarkdown) {
        var html = Embeds.parseMarkdown(src || '');
        if (html != null) return html;
      }
      if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(src || ''));
    } catch (e) {}
    return null;
  }

  function setBubbleContent(bubble, text) {
    var html = renderMd(text);
    if (html != null) bubble.innerHTML = html;
    else bubble.textContent = text;
  }

  function nearBottom() { return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120; }
  function scrollBottom(force) { if (force || nearBottom()) scrollEl.scrollTop = scrollEl.scrollHeight; }

  // ===== 会话列表 =====
  async function loadSessions() {
    try {
      var res = await fetch('/console/api/chat/sessions', { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
      var data = await res.json();
      listEl.innerHTML = '';
      (data.sessions || []).forEach(function (s) {
        var item = document.createElement('div');
        item.className = 'chat-s-item' + (String(s.id) === String(currentId) ? ' active' : '');
        item.dataset.id = s.id;
        item.innerHTML = '<span class="chat-s-title">' + esc(s.title) + '</span>' +
          '<button type="button" class="chat-s-del" title="' + UI.t('chat.deleteSession') + '" aria-label="' + UI.t('chat.deleteSession') + '">✕</button>';
        item.addEventListener('click', function (e) {
          if (e.target.closest('.chat-s-del')) return;
          openSession(s.id);
        });
        item.querySelector('.chat-s-del').addEventListener('click', async function (e) {
          e.stopPropagation();
          var ok = await UI.confirm(UI.t('chat.deleteConfirm'), { danger: true });
          if (!ok) return;
          try {
            var r = await fetch('/console/api/chat/sessions/' + s.id, { method: 'DELETE', headers: { 'X-Requested-With': 'XMLHttpRequest' } });
            if (!r.ok) { UI.alert(UI.t('chat.sendFailed')); return; }
            if (String(s.id) === String(currentId)) { currentId = null; showHero(true); msgsEl.innerHTML = ''; }
            loadSessions();
          } catch (err) { UI.alert(UI.t('chat.sendFailed')); }
        });
        listEl.appendChild(item);
      });
      if (!listEl.children.length) listEl.innerHTML = '<div class="muted chat-empty">' + UI.t('chat.noSession') + '</div>';
    } catch (e) {
      listEl.innerHTML = '<div class="muted chat-empty">' + UI.t('chat.loadingFailed') + '</div>';
    }
  }

  function markActive() {
    listEl.querySelectorAll('.chat-s-item').forEach(function (el) {
      el.classList.toggle('active', el.dataset.id === String(currentId));
    });
  }

  function showHero(show) { heroEl.hidden = !show; }

  // ===== 消息渲染 =====
  function addMsg(role, text, streaming) {
    var wrap = document.createElement('div');
    wrap.className = 'chat-m ' + role;
    var av = document.createElement('span');
    av.className = 'chat-avatar';
    if (role === 'user') {
      var uname = document.body.dataset.userName || '';
      av.textContent = uname ? uname.charAt(0) : UI.t('chat.you');
      if (uname) av.title = uname;
    }
    else {
      var siteLogo = document.body.dataset.siteLogo || '/static/logo-mark.svg';
      av.innerHTML = '<img src="' + esc(siteLogo) + '" alt="" style="width:100%;height:100%;object-fit:contain;background:#fff;border-radius:50%;padding:5px;box-sizing:border-box">';
    }
    var bubble = document.createElement('div');
    bubble.className = 'chat-bubble';
    if (role === 'user') { bubble.textContent = text; }
    else if (streaming) { bubble.innerHTML = workingHtml(); wrap._raw = text || ''; }
    else setBubbleContent(bubble, text);
    wrap.appendChild(av); wrap.appendChild(bubble);
    msgsEl.appendChild(wrap);
    scrollBottom(true);
    return { wrap: wrap, bubble: bubble };
  }

  // 流式等待占位："正在处理"+动态点，首个增量到达后被内容替换
  function workingHtml() {
    return '<span class="chat-working">' + esc(UI.t('chat.working')) + '<span class="chat-dots"></span></span><span class="chat-cursor">▍</span>';
  }

  function appendDelta(target, delta) {
    target.wrap._raw = (target.wrap._raw || '') + delta;
    setBubbleContent(target.bubble, target.wrap._raw);
    scrollBottom(false);
  }

  // 工具调用状态条：Worring + 点数 0→4 循环
  function stopStatusAnim(target) {
    if (target.statusTimer) { clearInterval(target.statusTimer); target.statusTimer = null; }
  }
  function showToolStatus(target, names) {
    stopStatusAnim(target);
    if (target.status) target.status.remove();
    target.status = document.createElement('div');
    target.status.className = 'chat-tool-status';
    target.status.title = names;
    var dots = 0;
    var render = function () { target.status.innerHTML = '<span class="chat-tool-dot"></span>Worring' + '.'.repeat(dots); };
    render();
    target.statusTimer = setInterval(function () { dots = (dots + 1) % 5; render(); }, 350);
    target.bubble.textContent = '';
    target.bubble.appendChild(target.status);
    scrollBottom(false);
  }

  // 敏感操作审批：AI 请求删除/恢复类操作时弹窗让用户裁决，SSE 会阻塞等待结果
  async function showApproval(target, approval) {
    if (target.status) { stopStatusAnim(target); target.status.remove(); target.status = null; }
    var toolNames = {
      delete_document:  UI.t('chat.apprDelete'),
      restore_document: UI.t('chat.apprRestore'),
      restore_revision: UI.t('chat.apprRevision'),
      set_share:        UI.t('chat.apprShare')
    };
    var detail = approval.args && approval.args !== '***' ? '\n' + approval.args : '';
    var ok = await UI.confirm((toolNames[approval.tool] || approval.tool) + detail, { danger: true });
    showToolStatus(target, approval.tool);
    try {
      await fetch('/console/api/chat/approvals/' + encodeURIComponent(approval.id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ approve: !!ok })
      });
    } catch (e) { /* 连接断开时 SSE 会自行终止 */ }
  }

  // ===== 会话加载与发送 =====
  async function openSession(id) {
    if (window.matchMedia('(max-width:900px)').matches) closeDrawer();
    if (sending) { UI.toast(UI.t('chat.waitStreaming'), 'error'); return; }
    currentId = id;
    markActive();
    try {
      var res = await fetch('/console/api/chat/sessions/' + id + '/messages', { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
      var data = await res.json();
      msgsEl.innerHTML = '';
      var has = (data.messages || []).length > 0;
      showHero(!has);
      (data.messages || []).forEach(function (m) {
        if (m.role === 'system') return;
        addMsg(m.role === 'user' ? 'user' : 'assistant', m.content, false);
      });
    } catch (e) { UI.alert(UI.t('chat.loadingFailed')); }
  }

  function newSession() {
    if (sending) { UI.toast(UI.t('chat.waitStreaming'), 'error'); return; }
    currentId = null;
    markActive();
    msgsEl.innerHTML = '';
    showHero(true);
    inputEl.focus();
  }

  async function ensureSession() {
    if (currentId) return currentId;
    var res = await fetch('/console/api/chat/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
      body: '{}'
    });
    var data = await res.json();
    if (!res.ok) throw new Error((data && data.error) || UI.t('chat.sendFailed'));
    currentId = data.session.id;
    return currentId;
  }

  var abortCtrl = null;   // 当前流式请求的中止控制器
  var lastSent = '';      // 最近一次发送的内容（用于"重新发送"）

  async function send(resendText) {
    var text = (typeof resendText === 'string' ? resendText : inputEl.value).trim();
    if (!text || sending) return;
    sending = true;
    lastSent = text;
    setSendBtnBusy(true);
    inputEl.value = '';
    autoGrow();
    showHero(false);
    addMsg('user', text, false);
    var ai = addMsg('assistant', '', true);
    try {
      var sid = await ensureSession();
      abortCtrl = new AbortController();
      var res = await fetch('/console/api/chat/sessions/' + sid + '/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
        body: JSON.stringify({ content: text }),
        signal: abortCtrl.signal
      });
      if (!res.ok) {
        var errData = await res.json().catch(function () { return {}; });
        throw new Error((errData && errData.error) || UI.t('chat.sendFailed'));
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      var done = false;
      while (!done) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var parts = buf.split('\n\n');
        buf = parts.pop();
        for (var i = 0; i < parts.length; i++) {
          var line = parts[i].trim();
          if (line.indexOf('data:') !== 0) continue;
          var payload;
          try { payload = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
          if (payload.reset) { ai.bubble.textContent = ''; if (ai.status) { stopStatusAnim(ai); ai.status.remove(); ai.status = null; } }
          if (payload.tool) { showToolStatus(ai, payload.tool); }
          if (payload.approval) { showApproval(ai, payload.approval); }
          if (payload.delta) { if (ai.status) { stopStatusAnim(ai); ai.status.remove(); ai.status = null; } ai.bubble.textContent = ''; ai.gotDelta = true; appendDelta(ai, payload.delta); }
          if (payload.error) {
            // 尚未有正文时清掉加载动画占位，避免"正在处理…"一直转
            if (!ai.gotDelta) ai.bubble.textContent = '';
            var errEl = document.createElement('div');
            errEl.className = 'chat-m-error';
            errEl.textContent = UI.t('chat.streamError') + payload.error;
            ai.bubble.appendChild(errEl);
            if (lastSent) {
              var re = document.createElement('button');
              re.type = 'button'; re.className = 'chat-resend';
              re.textContent = UI.t('chat.resend');
              re.addEventListener('click', function () { re.remove(); send(lastSent); });
              ai.bubble.appendChild(re);
            }
          }
          if (payload.done) done = true;
        }
      }
    } catch (e) {
      ai.bubble.innerHTML = '';
      var el = document.createElement('div');
      el.className = 'chat-m-error';
      el.textContent = (e && e.name === 'AbortError') ? UI.t('chat.stopped') : (e.message || UI.t('chat.sendFailed'));
      ai.bubble.appendChild(el);
      // 停止/失败后提供"重新发送"
      if (lastSent) {
        var re = document.createElement('button');
        re.type = 'button'; re.className = 'chat-resend';
        re.textContent = UI.t('chat.resend');
        re.addEventListener('click', function () { re.remove(); send(lastSent); });
        ai.bubble.appendChild(re);
      }
    } finally {
      sending = false;
      abortCtrl = null;
      setSendBtnBusy(false);
      loadSessions();
      scrollBottom(false);
    }
  }

  // 发送中：按钮变"停止"；空闲：恢复"发送"
  var sendIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  var stopIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  function setSendBtnBusy(busy) {
    sendBtn.innerHTML = busy ? stopIcon : sendIcon;
    sendBtn.disabled = busy ? false : !inputEl.value.trim();
    sendBtn.setAttribute('aria-label', busy ? '停止' : '发送');
  }

  function stopGenerating() {
    if (abortCtrl) abortCtrl.abort();
  }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
    sendBtn.disabled = !inputEl.value.trim() || sending;
  }

  inputEl.addEventListener('input', autoGrow);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', function () { if (sending) stopGenerating(); else send(); });
  newBtn.addEventListener('click', newSession);

  // ===== 移动端抽屉侧栏 =====
  var sideEl = document.querySelector('.chat-side');
  var backdrop = document.getElementById('chatBackdrop');
  function openDrawer() { sideEl.classList.add('open'); backdrop.hidden = false; requestAnimationFrame(function () { backdrop.classList.add('show'); }); }
  function closeDrawer() { sideEl.classList.remove('open'); backdrop.classList.remove('show'); setTimeout(function () { backdrop.hidden = true; }, 220); }
  document.getElementById('sideToggle').addEventListener('click', openDrawer);
  document.getElementById('newSessionBtnM').addEventListener('click', function () { closeDrawer(); newSession(); });
  backdrop.addEventListener('click', closeDrawer);

  // 快捷提问 chips：填入输入框
  document.querySelectorAll('.chat-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      inputEl.value = chip.textContent;
      autoGrow();
      inputEl.focus();
    });
  });

  loadSessions();
  inputEl.focus();
})();
</script>
{{template "adminfoot" .}}
</body>
</html>
{{end}}
