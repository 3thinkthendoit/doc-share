{{define "share_password.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>{{template "head" .}}</head>
<body class="auth-body">
  <div class="auth-lang">{{template "langSwitch" .}}</div>
  <div class="auth-card">
    <h1 class="auth-title">{{$.T "受保护的文档"}}</h1>
    <p class="auth-sub">{{.title}}</p>
    {{if .error}}<div class="alert alert-error">{{.error}}</div>{{end}}
    <form method="post" action="/s/{{.token}}">
      <label>{{$.T "访问密码"}}
        <input type="password" name="password" required autofocus>
      </label>
      <button type="submit" class="btn btn-primary btn-block">{{$.T "查看文档"}}</button>
    </form>
  </div>
</body>
</html>
{{end}}
